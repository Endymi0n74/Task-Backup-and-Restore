[package]
name = "task-backup-restore"
version = "1.0.0"
description = "Task backup and restore — export/import des tâches planifiées Windows (Task Scheduler) avec journalisation"
authors = ["Endymi0n74"]
license = "MIT"
edition = "2021"
rust-version = "1.70"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rfd = "0.15"
# Archives ZIP d'export : compression Deflate + chiffrement AES-256 (WinZip AES).
zip = { version = "4.6", default-features = false, features = ["aes-crypto", "deflate", "time"] }
tsbak = { path = "../tsbak" }

# Processus enfant élevé (ShellExecuteExW, verbe "runas") — Windows uniquement.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_System_Registry",
] }

[dev-dependencies]
tempfile = "3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = 2