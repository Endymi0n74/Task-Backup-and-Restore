[package]
name = "tsbak"
version = "0.1.0"
edition = "2021"
description = "Export/import des taches planifiees Windows (Task Scheduler) au format XML"
license = "MIT"

[lib]
name = "tsbak"
path = "src/lib.rs"

[[bin]]
name = "tsbak"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.4.18", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
anyhow = "1"
thiserror = "1"
rpassword = "=7.3.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
quick-xml = "0.31"
walkdir = "2"

# L'acces COM reel au Task Scheduler n'existe que sous Windows : cette dependance
# n'est donc telechargee/compilee que lors d'une cible Windows.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_System_TaskScheduler",
    "Win32_System_Com",
    "Win32_System_Variant",
    "Win32_Foundation",
    "Win32_System_Ole",
    "Win32_Security",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "=3.10.1"

[profile.release]
opt-level = 2
